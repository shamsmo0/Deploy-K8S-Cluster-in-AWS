# ============================================================
# site.yml — Production-Ready Kubernetes Cluster Setup
# ============================================================

# ────────────────────────────────────────────────────────────
# STEP 1: Common setup for ALL nodes
# ────────────────────────────────────────────────────────────
- name: Kubernetes base setup
  hosts: all
  become: yes
  gather_facts: yes

  tasks:

    - name: Disable swap (runtime)
      command: swapoff -a
      changed_when: false

    - name: Disable swap permanently
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Set sysctl params for Kubernetes networking
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        state: present
        reload: yes
      loop:
        - { key: net.bridge.bridge-nf-call-iptables, value: '1' }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: '1' }
        - { key: net.ipv4.ip_forward, value: '1' }

    # ─────────────────────────────────────────────
    # Install containerd (NO docker repo)
    # ─────────────────────────────────────────────
    - name: Install containerd
      yum:
        name: containerd
        state: present

    - name: Generate containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable SystemdCgroup in containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart containerd
      service:
        name: containerd
        state: restarted
        enabled: yes

    # ─────────────────────────────────────────────
    # Kubernetes repo
    # ─────────────────────────────────────────────
    - name: Add Kubernetes repo
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.29/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.29/rpm/repodata/repomd.xml.key
          exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

    - name: Install Kubernetes components
      yum:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Enable kubelet
      service:
        name: kubelet
        enabled: yes
        state: started


# ────────────────────────────────────────────────────────────
# STEP 2: Master node init
# ────────────────────────────────────────────────────────────
- name: Initialize Kubernetes master
  hosts: master
  become: yes

  tasks:

    - name: Check cluster already exists
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s

    - name: kubeadm init
      command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      when: not k8s.stat.exists
      register: init_output

    - name: Setup kubeconfig for ec2-user
      file:
        path: /home/ec2-user/.kube
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Copy kubeconfig
      copy:
        remote_src: yes
        src: /etc/kubernetes/admin.conf
        dest: /home/ec2-user/.kube/config
        owner: ec2-user
        group: ec2-user

    - name: Install Flannel CNI
      become_user: ec2-user
      command: >
        kubectl apply -f
        https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config

    - name: Generate join command
      command: kubeadm token create --print-join-command
      register: join

    - name: Save join command
      set_fact:
        k8s_join_command: "{{ join.stdout }}"


# ────────────────────────────────────────────────────────────
# STEP 3: Worker nodes join cluster
# ────────────────────────────────────────────────────────────
- name: Join workers
  hosts: workers
  become: yes

  tasks:

    - name: Check if already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: joined

    - name: Join cluster
      command: "{{ hostvars[groups['master'][0]]['k8s_join_command'] }}"
      when: not joined.stat.exists


# ────────────────────────────────────────────────────────────
# STEP 4: Verify cluster
# ────────────────────────────────────────────────────────────
- name: Verify cluster
  hosts: master
  become_user: ec2-user

  tasks:

    - name: Wait for nodes ready
      command: kubectl get nodes --no-headers
      register: nodes
      retries: 20
      delay: 15
      until: nodes.stdout_lines | length == (groups['all'] | length)
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config

    - name: Show nodes
      debug:
        msg: "{{ nodes.stdout_lines }}"
